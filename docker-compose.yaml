services:
  postgres:
    image: postgres:16-alpine
    container_name: energy_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: energy-forecasting-airflow:latest
    container_name: energy_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PYTHONPATH: /opt/airflow/project
      PROJECT_ROOT: /opt/airflow/project
      PROJECT_PYTHON: python
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: >
      bash -c "
      airflow db migrate &&
      (airflow users create --username admin --password admin --firstname Energy --lastname MLOps --role Admin --email admin@energy-mlops.local || true)
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: energy-forecasting-airflow:latest
    container_name: energy_airflow_webserver
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      PYTHONPATH: /opt/airflow/project
      PROJECT_ROOT: /opt/airflow/project
      PROJECT_PYTHON: python
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: airflow webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: energy-forecasting-airflow:latest
    container_name: energy_airflow_scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_password@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      PYTHONPATH: /opt/airflow/project
      PROJECT_ROOT: /opt/airflow/project
      PROJECT_PYTHON: python
    volumes:
      - .:/opt/airflow/project
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: airflow scheduler

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: energy-forecasting-airflow:latest
    container_name: energy_mlflow_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true
    volumes:
      - .:/opt/airflow/project
    working_dir: /opt/airflow/project
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////opt/airflow/project/mlflow.db
      --default-artifact-root /opt/airflow/project/mlartifacts

volumes:
  postgres-db-volume:

