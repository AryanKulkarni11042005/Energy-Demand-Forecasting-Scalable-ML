services:
  - type: web
    name: energy-demand-forecasting
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_MLFLOW_REGISTRY
        value: "false"
      - key: CLOUD_STORAGE_SYNC_ON_STARTUP
        value: "false"
